[package]
name = "bara"
version = "0.1.0"
edition = "2021"

# [profile.release]
# strip = true
# lto = true

[dependencies]
chrono = { version="0.4.39", features = ["serde"] }
uuid = { version = "0.8", features = ["v5"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0.138"
regex = "1.7"
pulldown-cmark = "0.9"
syntect = {version="4.6" }
reqwest = { version = "0.11", features = ["json", "blocking"] }
walkdir = "2.5.0"
semver = "1.0"
clap = { version = "4.0", features = ["derive"] }
minijinja = { version="2.7.0", features=["loader"] }
grass = "0.13.4"
temp-dir = "0.1.14"
versions = "6.3.2"
