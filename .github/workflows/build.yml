name: CI

on:
  push:
    branches: [trunk]

jobs:
  build:
    strategy:
      matrix:
        system: [x86_64-linux, aarch64-darwin]
    runs-on: ${{ matrix.system == 'x86_64-linux' && 'ubuntu-latest' || 'macos-arm64' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Setup Nix cache
        uses: actions/cache@v3
        with:
          path: |
            /nix/store
            .cache/nix
          key: ${{ runner.os }}-nix-${{ matrix.system }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-nix-${{ matrix.system }}-

      - name: Build for target system
        run: nix build .#devShell.${{ matrix.system }}

      - name: Lint and checks
        run: |
          nix develop --command cargo clippy --all-targets -- -D warnings
          nix develop --command cargo fmt -- --check
